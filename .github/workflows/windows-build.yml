# Windows EXE 自动构建与打包
# 触发方式: 推送 v* 标签 (如 v0.1.0), 或在 Actions 页面手动运行 (workflow_dispatch)
# 构建逻辑与 packaging/windows/build-windows.ps1 完全一致 (CI 直接调用该脚本)
name: windows-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 只拉主仓库: moose/gmsh 子模块在 Windows 打包中不需要
      # (递归拉取会因 moose 嵌套子模块 TriBITS 的超长文件名在 Windows 上失败)
      - name: Checkout (仅主仓库)
        uses: actions/checkout@v4

      # CMake 无条件 add_subdirectory(external/yaml-cpp), 必须单独初始化
      - name: 初始化 yaml-cpp 子模块
        run: git submodule update --init external/yaml-cpp

      # vcpkg 全量依赖首次编译需 2-4 小时, 之后命中缓存只需几分钟
      - name: vcpkg 缓存
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: vcpkg-release-qt-vtk-gmsh-${{ hashFiles('.github/workflows/windows-build.yml') }}
          restore-keys: vcpkg-release-qt-vtk-gmsh-

      # x64-windows 默认同时编 Debug+Release, 会写爆 runner 磁盘 (LNK1116/112);
      # 先清掉用不到的 Android SDK / dotnet 等, 释放 15-20GB
      - name: 释放磁盘空间
        shell: pwsh
        run: |
          $paths = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT,
                     "C:\Program Files\dotnet", "C:\Program Files (x86)\Android")
          foreach ($p in $paths) {
            if ($p -and (Test-Path $p)) {
              Write-Host "removing $p"
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      # 只编 Release (x64-windows-release), 磁盘与时间减半
      - name: 安装 vcpkg 依赖 (qtbase / vtk[qt] / gmsh / yaml-cpp)
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          C:\vcpkg\vcpkg install qtbase "vtk[qt]" gmsh yaml-cpp --triplet x64-windows-release

      - name: 构建并打包
        shell: pwsh
        run: packaging\windows\build-windows.ps1 -VcpkgRoot C:\vcpkg

      - name: 上传 EXE 打包产物
        uses: actions/upload-artifact@v4
        with:
          name: gmp_ise-windows-x64
          path: gmp_ise-windows-x64.zip
          retention-days: 30
