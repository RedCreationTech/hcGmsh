# Windows EXE 自动构建与打包
# 触发方式: 推送 v* 标签 (如 v0.1.0), 或在 Actions 页面手动运行 (workflow_dispatch)
# 构建逻辑与 packaging/windows/build-windows.ps1 共用 (CI 直接调用该脚本)
#
# 依赖路线: conda-forge 预编译包 (qt6-main / vtk / gmsh), 零源码编译,
# 全程约 10-20 分钟, 磁盘占用几个 GB. conda 版 vtk 已启用 GUISupportQt/RenderingQt.
name: windows-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 只拉主仓库: moose/gmsh 子模块在 Windows 打包中不需要
      # (递归拉取会因 moose 嵌套子模块 TriBITS 的超长文件名在 Windows 上失败)
      - name: Checkout (仅主仓库)
        uses: actions/checkout@v4

      # CMake 无条件 add_subdirectory(external/yaml-cpp), 必须单独初始化
      - name: 初始化 yaml-cpp 子模块
        run: git submodule update --init external/yaml-cpp

      - name: 安装 conda-forge 预编译依赖 (qt6-main / vtk / gmsh)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gmp-win
          create-args: >-
            qt6-main
            vtk
            gmsh
          cache-environment: true
          cache-downloads: true

      - name: 构建并打包
        shell: pwsh
        run: packaging\windows\build-windows.ps1 -CondaPrefix "$env:MAMBA_ROOT_PREFIX\envs\gmp-win"

      - name: 上传 EXE 打包产物
        uses: actions/upload-artifact@v4
        with:
          name: gmp_ise-windows-x64
          path: gmp_ise-windows-x64.zip
          retention-days: 30
